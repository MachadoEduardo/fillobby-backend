name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/fillobby_test?replicaSet=rs0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:openapi

      - name: Start MongoDB replica set
        run: >-
          docker run --detach --name fillobby-ci-mongodb
          --publish 27017:27017
          mongo:8.0 mongod --replSet rs0 --bind_ip_all

      - name: Initialize MongoDB replica set
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker exec fillobby-ci-mongodb mongosh --quiet --eval "db.adminCommand('ping').ok"; then
              break
            fi
            sleep 2
          done
          docker exec fillobby-ci-mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          for attempt in {1..30}; do
            if docker exec fillobby-ci-mongodb mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - run: npm run test:ci

      - name: Build production image
        run: docker build --target production --tag fillobby-backend:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout backend under test
        uses: actions/checkout@v4
        with:
          path: fillobby-backend

      - name: Checkout frontend main
        uses: actions/checkout@v4
        with:
          repository: MachadoEduardo/fillobby-frontend
          ref: main
          path: fillobby-frontend

      - uses: actions/setup-node@v4
        with:
          node-version-file: fillobby-frontend/.nvmrc
          cache: npm
          cache-dependency-path: fillobby-frontend/package-lock.json

      - run: npm ci
        working-directory: fillobby-frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: fillobby-frontend

      - name: Start isolated E2E stack
        run: docker compose --env-file .env.e2e up --build --detach --wait
        working-directory: fillobby-backend

      - name: Run central E2E flows
        run: npm run test:e2e
        working-directory: fillobby-frontend
        env:
          E2E_BASE_URL: http://localhost:5174
          E2E_API_URL: http://127.0.0.1:3100

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.e2e logs --no-color
        working-directory: fillobby-backend

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-diagnostics
          path: |
            fillobby-frontend/playwright-report
            fillobby-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated E2E stack
        if: always()
        run: docker compose --env-file .env.e2e down --volumes --remove-orphans
        working-directory: fillobby-backend
