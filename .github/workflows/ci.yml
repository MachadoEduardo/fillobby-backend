name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/fillobby_test?replicaSet=rs0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:openapi

      - name: Start MongoDB replica set
        run: >-
          docker run --detach --name fillobby-ci-mongodb
          --publish 27017:27017
          mongo:8.0 mongod --replSet rs0 --bind_ip_all

      - name: Initialize MongoDB replica set
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker exec fillobby-ci-mongodb mongosh --quiet --eval "db.adminCommand('ping').ok"; then
              break
            fi
            sleep 2
          done
          docker exec fillobby-ci-mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          for attempt in {1..30}; do
            if docker exec fillobby-ci-mongodb mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - run: npm run test:ci

      - name: Build production image
        run: docker build --target production --tag fillobby-backend:ci .
