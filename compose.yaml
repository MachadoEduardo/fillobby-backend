name: fillobby

services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${FILLOBBY_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        mongosh --host mongodb:27017 --quiet --eval
        "try { rs.status() } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }";
        until mongosh --host mongodb:27017 --quiet --eval
        "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done
    restart: "no"

  backend:
    build:
      context: .
      target: development
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/${FILLOBBY_DB_NAME:-fillobby}?replicaSet=rs0
      TEST_MONGO_URI: mongodb://mongodb:27017/${FILLOBBY_TEST_DB_NAME:-fillobby_test}?replicaSet=rs0
      JWT_SECRET: local-docker-secret-not-for-production
      JWT_EXPIRES_IN: 1d
      BCRYPT_ROUNDS: 12
      AUTH_REGISTER_RATE_LIMIT: ${FILLOBBY_AUTH_REGISTER_RATE_LIMIT:-5}
      AUTH_LOGIN_RATE_LIMIT: ${FILLOBBY_AUTH_LOGIN_RATE_LIMIT:-10}
      NODE_ENV: ${FILLOBBY_NODE_ENV:-development}
      FRONTEND_URL: http://localhost:${FILLOBBY_FRONTEND_PORT:-5173}
    ports:
      - "${FILLOBBY_BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ../fillobby-frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:${FILLOBBY_BACKEND_PORT:-3000}
    ports:
      - "${FILLOBBY_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../fillobby-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mongodb_data:
  backend_node_modules:
  frontend_node_modules:
